<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Maquette complète — invitation de mariage ARMAND &amp; FEMME</title>
  <desc id="description">Planche présentant l’enveloppe, les quatre pages du faire-part et son verso final dans un style ivoire, bordeaux et or.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#f2ece4"/>
      <stop offset="1" stop-color="#e6dcd1"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#713843"/>
      <stop offset=".52" stop-color="#4a1725"/>
      <stop offset="1" stop-color="#310e19"/>
    </linearGradient>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee8dd"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#f0dcad"/>
      <stop offset="1" stop-color="#b69461"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8f4"/>
      <stop offset=".58" stop-color="#efd6dc"/>
      <stop offset="1" stop-color="#c88f9d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#442c26" flood-opacity=".17"/>
    </filter>
    <pattern id="grain" width="85" height="85" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r=".7" fill="#8f7764" opacity=".14"/>
      <circle cx="38" cy="51" r=".65" fill="#8f7764" opacity=".11"/>
      <circle cx="72" cy="27" r=".6" fill="#8f7764" opacity=".12"/>
      <circle cx="61" cy="76" r=".7" fill="#8f7764" opacity=".1"/>
    </pattern>
    <g id="butterfly" stroke="#997a59" stroke-width="1.25" stroke-linejoin="round">
      <path d="M0 0C-22-43-70-61-84-43-98-24-66 10-19 18-50 30-45 61-25 64-4 67-1 35 0 0Z" fill="url(#wing)"/>
      <path d="M0 0C22-43 70-61 84-43 98-24 66 10 19 18 50 30 45 61 25 64 4 67 1 35 0 0Z" fill="url(#wing)"/>
      <path d="M-5-2-72-38M-6 7-78-15M-11 17-64 17M6-2 72-38M6 7 78-15M11 17 64 17M0-12Q-15-39-30-53M0-12Q15-39 30-53" fill="none" stroke="#b18c69" stroke-width=".8"/>
      <path d="M0-7Q-5 18 0 40Q5 18 0-7Z" fill="#533626" stroke="none"/>
      <path d="M-1-8Q-15-32-24-43M1-8Q15-32 24-43" fill="none" stroke="#70513a"/>
    </g>
    <g id="flower" fill="none" stroke="#bf958c" stroke-width="1.2" opacity=".75">
      <path d="M0 90C30 58 20 30 57 4M20 63C-2 57-3 40 7 36 18 33 23 48 13 48M34 40C52 43 67 31 60 21 54 11 41 19 48 27M52 15C42 1 51-9 61-5 72-1 66 12 58 7"/>
      <ellipse cx="6" cy="37" rx="8" ry="3" transform="rotate(-27 6 37)"/>
      <ellipse cx="61" cy="21" rx="8" ry="3" transform="rotate(32 61 21)"/>
    </g>
    <g id="ornateFrame" fill="none" stroke="#e8d3ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 14C136 35 121 35 111 25 101 15 105 3 114 4 122 5 122 15 116 15M150 14C164 35 179 35 189 25 199 15 195 3 186 4 178 5 178 15 184 15"/>
      <path d="M150 14C148 31 138 40 125 46M150 14C152 31 162 40 175 46"/>
      <path d="M125 46C106 37 92 45 97 58 101 68 114 65 112 57M175 46C194 37 208 45 203 58 199 68 186 65 188 57"/>
      <path d="M102 57C82 75 78 96 87 115 96 135 83 152 77 165M198 57C218 75 222 96 213 115 204 135 217 152 223 165"/>
      <path d="M77 165C61 180 65 200 79 207 92 214 101 201 92 194M223 165C239 180 235 200 221 207 208 214 199 201 208 194"/>
      <path d="M79 207C72 230 84 247 103 243 119 239 121 222 107 221M221 207C228 230 216 247 197 243 181 239 179 222 193 221"/>
      <path d="M103 243C116 258 134 259 150 248 166 259 184 258 197 243"/>
      <path d="M150 39C128 54 120 79 124 105 130 139 121 166 125 190 130 216 137 232 150 239 163 232 170 216 175 190 179 166 170 139 176 105 180 79 172 54 150 39Z" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="150" cy="14" r="2" fill="#e8d3ae"/><circle cx="77" cy="165" r="2" fill="#e8d3ae"/><circle cx="223" cy="165" r="2" fill="#e8d3ae"/>
    </g>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .script{font-family:'Brush Script MT','Segoe Script',cursive;font-style:italic}
      .ink{fill:#66544d}
      .muted{fill:#927f75}
      .wineText{fill:#824956}
      .goldText{fill:#d9c39c}
      .label{font:600 13px Arial,sans-serif;letter-spacing:3px;fill:#815764}
      .smallcaps{font:11px Arial,sans-serif;letter-spacing:2.6px}
      .card{filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1440" height="1120" fill="url(#background)"/>
  <rect width="1440" height="1120" fill="url(#grain)" opacity=".55"/>
  <text x="720" y="58" text-anchor="middle" class="serif" font-size="29" letter-spacing="3" fill="#4a1725">ADELE ARMAND &amp; OLIVER FEMME</text>
  <text x="720" y="84" text-anchor="middle" class="smallcaps" fill="#9a8276">MAQUETTE DE L’INVITATION NUMÉRIQUE · ENVELOPPE ET 5 FACES</text>
  <path d="M548 103H892" stroke="#b79b73" stroke-width="1"/>

  <!-- Closed envelope -->
  <g transform="translate(49 138)">
    <text x="160" y="-18" text-anchor="middle" class="label">ENVELOPPE</text>
    <g class="card">
      <rect x="0" y="0" width="320" height="423" rx="5" fill="url(#wine)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#ddc59f" opacity=".42"/>
      <rect x="1" y="1" width="318" height="421" rx="5" fill="url(#grain)" opacity=".28"/>
      <use href="#flower" transform="translate(10 27) scale(1.05)"/>
      <use href="#flower" transform="translate(307 27) scale(-1.05 1.05)"/>
      <path d="M0 5H320L160 244Z" fill="#642c39" stroke="#93656a" stroke-opacity=".5"/>
      <path d="M0 423 160 235 320 423Z" fill="#461522" opacity=".9"/>
      <path d="M0 0 160 225 0 423ZM320 0 160 225 320 423Z" fill="#592330" opacity=".65"/>
      <circle cx="160" cy="225" r="35" fill="#3c1520" stroke="#d7bb90" stroke-width="1.4"/>
      <circle cx="160" cy="225" r="27" fill="none" stroke="#d7bb90" stroke-opacity=".6"/>
      <text x="160" y="232" text-anchor="middle" class="script" font-size="29" fill="#e7d2ad">A &amp; O</text>
      <text x="160" y="350" text-anchor="middle" class="smallcaps" fill="#f3e8d6">OUVRIR MON INVITATION</text>
      <path d="M112 362H208" stroke="#d5bb96"/>
      <text x="160" y="386" text-anchor="middle" class="script" font-size="13" fill="#ead9c5">Un doux message, scellé avec amour</text>
    </g>
  </g>

  <!-- Page 1: Welcome -->
  <g transform="translate(405 138)">
    <text x="160" y="-18" text-anchor="middle" class="label">PAGE 1 · BIENVENUE</text>
    <g class="card">
      <rect width="320" height="423" rx="3" fill="url(#paper)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#b9a17f" opacity=".44"/>
      <rect width="320" height="423" fill="url(#grain)" opacity=".34"/>
      <text x="160" y="43" text-anchor="middle" class="smallcaps" fill="#b49c7f">AVEC AMOUR &amp; JOIE</text>
      <g transform="translate(160 110) scale(.7)"><use href="#butterfly"/></g>
      <text x="160" y="225" text-anchor="middle" class="smallcaps wineText">AVEC LEURS FAMILLES</text>
      <text x="160" y="278" text-anchor="middle" class="serif" font-size="31" font-weight="600" letter-spacing="2" fill="#74414d">ARMAND</text>
      <text x="160" y="305" text-anchor="middle" class="script" font-size="23" fill="#a76572">&amp;</text>
      <text x="160" y="342" text-anchor="middle" class="serif" font-size="31" font-weight="600" letter-spacing="2" fill="#74414d">FEMME</text>
      <text x="160" y="374" text-anchor="middle" class="serif muted" font-size="14" font-style="italic">ont la joie de vous accueillir</text>
      <text x="160" y="397" text-anchor="middle" class="smallcaps wineText">????</text>
      <text x="160" y="449" text-anchor="middle" class="smallcaps muted">PRÉCÉDENT · 1 / 5 · SUIVANT</text>
    </g>
  </g>

  <!-- Page 2: Official invitation -->
  <g transform="translate(761 138)">
    <text x="160" y="-18" text-anchor="middle" class="label">PAGE 2 · INVITATION</text>
    <g class="card">
      <rect width="320" height="423" rx="3" fill="url(#paper)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#b9a17f" opacity=".44"/>
      <rect width="320" height="423" fill="url(#grain)" opacity=".34"/>
      <text x="160" y="48" text-anchor="middle" class="smallcaps wineText">AVEC LE BONHEUR DE LEURS FAMILLES</text>
      <text x="160" y="133" text-anchor="middle" class="script" font-size="29" fill="#8b3f51">Vous êtes invités</text>
      <path d="M93 151H227" stroke="#c6a579"/>
      <text x="160" y="190" text-anchor="middle" class="serif ink" font-size="16">à partager la célébration</text>
      <text x="160" y="215" text-anchor="middle" class="serif ink" font-size="16">de leur mariage et à les entourer</text>
      <text x="160" y="240" text-anchor="middle" class="serif ink" font-size="16">lors de cette journée inoubliable.</text>
      <text x="160" y="293" text-anchor="middle" class="smallcaps wineText">????</text>
      <text x="160" y="320" text-anchor="middle" class="serif muted" font-size="15">?? h ?? – ?? h ??</text>
      <text x="160" y="354" text-anchor="middle" class="smallcaps wineText">MAIRIE DE COCODY</text>
      <text x="160" y="449" text-anchor="middle" class="smallcaps muted">PRÉCÉDENT · 2 / 5 · SUIVANT</text>
    </g>
  </g>

  <!-- Page 3: Location -->
  <g transform="translate(1117 138)">
    <text x="160" y="-18" text-anchor="middle" class="label">PAGE 3 · LIEU</text>
    <g class="card">
      <rect width="320" height="423" rx="3" fill="url(#paper)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#b9a17f" opacity=".44"/>
      <rect width="320" height="423" fill="url(#grain)" opacity=".34"/>
      <text x="160" y="48" text-anchor="middle" class="smallcaps wineText">LE LIEU DE LA CÉRÉMONIE</text>
      <text x="160" y="107" text-anchor="middle" class="script" font-size="29" fill="#8b3f51">Rendez-vous à</text>
      <text x="160" y="144" text-anchor="middle" class="smallcaps wineText">MAIRIE DE COCODY</text>
      <text x="160" y="168" text-anchor="middle" class="serif muted" font-size="15">ABIDJAN, CÔTE D’IVOIRE</text>
      <rect x="32" y="187" width="256" height="142" fill="#e9e5d9" stroke="#c5b495"/>
      <path d="M38 218C75 207 83 236 118 226S170 207 197 226 248 247 281 218M35 291C70 271 93 302 124 284S177 264 209 285 252 300 286 277M84 190C92 220 77 245 92 271S112 307 96 326M224 189C208 220 231 246 214 271S200 304 220 326" fill="none" stroke="#c2c8b3" stroke-width="7" opacity=".8"/>
      <path d="M34 256H286M155 188V329" stroke="#fffdf7" stroke-width="7"/>
      <path d="M34 256H286M155 188V329" stroke="#d6b985" stroke-width="1"/>
      <path d="M160 235c-13 0-22 9-22 21 0 16 22 38 22 38s22-22 22-38c0-12-9-21-22-21Zm0 14a7 7 0 1 1 0 14 7 7 0 0 1 0-14" fill="#8d4c5b"/>
      <text x="160" y="350" text-anchor="middle" class="serif muted" font-size="13" font-style="italic">L’itinéraire s’ouvrira dans Google Maps.</text>
      <rect x="55" y="367" width="210" height="30" fill="#4a1725"/>
      <text x="160" y="387" text-anchor="middle" class="smallcaps" fill="#f7eee2">OBTENIR L’ITINÉRAIRE</text>
      <text x="160" y="449" text-anchor="middle" class="smallcaps muted">PRÉCÉDENT · 3 / 5 · SUIVANT</text>
    </g>
  </g>

  <!-- Page 4: RSVP -->
  <g transform="translate(237 625)">
    <text x="160" y="-18" text-anchor="middle" class="label">PAGE 4 · RSVP</text>
    <g class="card">
      <rect width="320" height="423" rx="3" fill="url(#paper)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#b9a17f" opacity=".44"/>
      <rect width="320" height="423" fill="url(#grain)" opacity=".34"/>
      <text x="160" y="64" text-anchor="middle" class="script" font-size="42" fill="#934c5e">Avec joie</text>
      <text x="160" y="99" text-anchor="middle" class="serif wineText" font-size="26" letter-spacing="6">R S V P</text>
      <text x="160" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="1" fill="#927f75">MERCI DE NOUS CONFIRMER VOTRE RÉPONSE</text>
      <text x="38" y="157" class="serif ink" font-size="14">Nom et prénom</text>
      <rect x="38" y="165" width="244" height="31" fill="#fffdf8" stroke="#ded3c7"/>
      <text x="49" y="186" class="serif muted" font-size="13">Votre nom complet</text>
      <text x="38" y="219" class="serif ink" font-size="14">Numéro de téléphone</text>
      <rect x="38" y="227" width="244" height="31" fill="#fffdf8" stroke="#ded3c7"/>
      <text x="49" y="248" class="serif muted" font-size="13">07 00 00 00 00</text>
      <text x="38" y="274" class="serif muted" font-size="12">Minimum 10 chiffres</text>
      <circle cx="46" cy="298" r="6" fill="none" stroke="#925361"/>
      <text x="60" y="303" class="serif ink" font-size="13">Oui, je serai présent(e).</text>
      <circle cx="46" cy="321" r="6" fill="none" stroke="#925361"/>
      <text x="60" y="326" class="serif ink" font-size="12">Non, je ne pourrai pas être présent(e).</text>
      <text x="39" y="349" class="serif ink" font-size="12">Nombre de personnes : 1</text>
      <rect x="38" y="358" width="244" height="32" fill="#f2ece2" stroke="#c7ab82"/>
      <text x="47" y="372" class="serif muted" font-size="10">Invitation personnelle et individuelle,</text>
      <text x="47" y="384" class="serif muted" font-size="10">réservée à la personne invitée.</text>
      <rect x="38" y="397" width="244" height="28" fill="#4a1725"/>
      <text x="160" y="416" text-anchor="middle" class="smallcaps" font-size="9" fill="#f7eee2">CONFIRMER MA PRÉSENCE</text>
      <text x="160" y="449" text-anchor="middle" class="smallcaps muted">PRÉCÉDENT · 4 / 5 · SUIVANT</text>
    </g>
  </g>

  <!-- Page 5: Back cover -->
  <g transform="translate(613 625)">
    <text x="160" y="-18" text-anchor="middle" class="label">PAGE 5 · VERSO FINAL</text>
    <g class="card">
      <rect width="320" height="423" rx="3" fill="url(#wine)"/>
      <rect x="12" y="12" width="296" height="399" fill="none" stroke="#ddc59f" opacity=".42"/>
      <rect width="320" height="423" fill="url(#grain)" opacity=".25"/>
      <g transform="translate(10 25) scale(1 .7)"><use href="#ornateFrame"/></g>
      <text x="160" y="176" text-anchor="middle" class="serif" font-size="32" font-weight="600" letter-spacing="2" fill="#f0dfbd">ARMAND</text>
      <text x="160" y="202" text-anchor="middle" class="script" font-size="22" fill="#e2b9a9">&amp;</text>
      <text x="160" y="241" text-anchor="middle" class="serif" font-size="32" font-weight="600" letter-spacing="2" fill="#f0dfbd">FEMME</text>
      <text x="160" y="284" text-anchor="middle" class="smallcaps" fill="#e2ceb1">????</text>
      <text x="160" y="314" text-anchor="middle" class="serif" font-size="14" fill="#e2ceb1">Merci de partager avec nous</text>
      <text x="160" y="335" text-anchor="middle" class="serif" font-size="14" fill="#e2ceb1">cette journée si précieuse.</text>
      <text x="160" y="372" text-anchor="middle" class="script" font-size="18" fill="#e2ceb1">Que notre amour continue</text>
      <text x="160" y="393" text-anchor="middle" class="script" font-size="18" fill="#e2ceb1">de s’écrire à vos côtés.</text>
      <rect x="102" y="432" width="116" height="29" fill="#f5eee6" stroke="#d9c39c"/>
      <text x="160" y="451" text-anchor="middle" class="smallcaps" font-size="9" fill="#87515c">‹ PRÉCÉDENT · 5 / 5</text>
    </g>
  </g>

  <!-- Navigation legend -->
  <g transform="translate(989 629)">
    <text x="160" y="0" text-anchor="middle" class="label">PARCOURS INVITÉ</text>
    <path d="M45 42V354" stroke="#b99b73" stroke-width="1.2"/>
    <g class="serif" font-size="15" fill="#66544d">
      <circle cx="45" cy="48" r="15" fill="#4a1725"/><text x="45" y="53" text-anchor="middle" fill="#fff8ed" font-size="12">1</text>
      <text x="76" y="53">Ouvrir l’invitation</text>
      <circle cx="45" cy="110" r="15" fill="#8a5260"/><text x="45" y="115" text-anchor="middle" fill="#fff8ed" font-size="12">2</text>
      <text x="76" y="115">Découvrir les mariés</text>
      <circle cx="45" cy="172" r="15" fill="#8a5260"/><text x="45" y="177" text-anchor="middle" fill="#fff8ed" font-size="12">3</text>
      <text x="76" y="177">Lire l’invitation</text>
      <circle cx="45" cy="234" r="15" fill="#8a5260"/><text x="45" y="239" text-anchor="middle" fill="#fff8ed" font-size="12">4</text>
      <text x="76" y="239">Voir le lieu à Cocody</text>
      <circle cx="45" cy="296" r="15" fill="#8a5260"/><text x="45" y="301" text-anchor="middle" fill="#fff8ed" font-size="12">5</text>
      <text x="76" y="301">Confirmer sa présence</text>
      <circle cx="45" cy="358" r="15" fill="#4a1725"/><text x="45" y="363" text-anchor="middle" fill="#fff8ed" font-size="12">6</text>
      <text x="76" y="363">Découvrir le verso final</text>
    </g>
    <text x="160" y="414" text-anchor="middle" class="script" font-size="22" fill="#8a5260">Une invitation à feuilleter</text>
  </g>
</svg>
